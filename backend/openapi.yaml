openapi: 3.1.0

info:
  title: Enactus Platform API
  version: 0.4.0
  description: |
    API de Enactus Platform (eduXaction Colombia).

    **Formato de error único.** Todo error responde con la misma forma:

    ```json
    { "error": { "code": "forbidden", "message": "…", "details": … } }
    ```

    `code` es el identificador estable que el cliente mira para decidir qué
    hacer; `message` es para la persona. Un error inesperado se registra
    entero en el servidor y llega genérico al cliente — nunca un detalle
    interno de PostgreSQL.

    **Dos criterios que conviene tener presentes al leer:**

    - Pedir por id un recurso que existe pero está fuera del alcance del rol
      devuelve **404, no 403**. Un 403 ya confirmaría que ese recurso existe.
    - Un estudiante de Open Learning que llama un endpoint exclusivo de
      Enactus recibe **403, nunca una lista vacía**: una lista vacía haría
      ver un bug de permisos como si fuera "todavía no hay datos".

    **Alcance de lectura.** Ningún listado devuelve todo a todo el mundo: el
    filtro por rol se aplica en el servidor y no se puede cambiar con un
    parámetro de la petición.

servers:
  - url: http://localhost:3000
    description: Desarrollo local
  - url: https://api-staging.eduxaction.co
    description: Staging (pendiente, Fase 6)
  - url: https://api.eduxaction.co
    description: Producción (pendiente, Fase 6)

tags:
  - name: auth
    description: Sesión, tokens y rotación
  - name: courses
    description: Cursos, módulos y lecciones (autoría de contenido)
  - name: progress
    description: Progreso y completitud — calculado en el servidor
  - name: students
    description: Ruta de Impacto y progreso de un estudiante
  - name: certificates
    description: Certificado de Ruta de Impacto
  - name: laboratories
    description: Laboratorios y estructura de la Ruta (solo Enactus)
  - name: orgs
    description: Proyectos y equipos (solo Enactus)
  - name: submissions
    description: Entregas, calificación y revisión
  - name: content
    description: Evidencias, calendario, recursos y notificaciones
  - name: forum
    description: Foro de la comunidad Enactus
  - name: users
    description: Personas, con alcance por rol
  - name: files
    description: URLs firmadas de subida y lectura
  - name: admin
    description: Permisos, respaldo y métricas

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [auth]
      summary: Estado del servicio
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  env: { type: string }
                  time: { type: string, format: date-time }

  /auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesión
      security: []
      description: |
        Limitado a 10 intentos por IP + correo cada 5 minutos.

        El mensaje y el tiempo de respuesta son idénticos exista o no la
        cuenta: si distinguieran, el endpoint sería un enumerador de usuarios.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotar el refresh token
      security: []
      description: |
        Cada uso emite un par nuevo y revoca el anterior.

        Si llega un refresh **ya revocado**, se interpreta como token robado
        y se revocan **todas** las sesiones de esa persona.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Par nuevo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Cerrar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        '204': { description: Sesión cerrada (siempre, exista o no el token) }

  /auth/me:
    get:
      tags: [auth]
      summary: Usuario de la sesión
      description: |
        Para estudiantes y alumni agrega dos campos que solo la propia persona
        puede ver de sí misma: `team` (equipo, proyecto y rol dentro del
        proyecto — antes salía de `AppUser.extra['groupId']`, una
        denormalización de Hive) y `sponsorName` (nombre de la empresa que la
        patrocina; `companyId` por sí solo no sirve para mostrarlo, y no existe
        un endpoint que le permita a un estudiante leer otra cuenta).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [auth]
      summary: Editar el propio perfil
      description: |
        Deliberadamente acotado: acepta nombre, teléfono, cédula, ciudad,
        carrera y el perfil libre. **No** acepta `role`, `studentType`,
        `university`, `canGrade*` ni las relaciones — esos los cambia un
        administrador. Si estuvieran acá, cualquiera podría ascenderse
        mandando un campo de más.
      responses:
        '200': { description: Perfil actualizado }
        '400': { $ref: '#/components/responses/ValidationError' }

  /site-content:
    get:
      tags: [content]
      summary: Contenido de la página principal
      security: []
      description: |
        **Único endpoint sin sesión además de `/health`**: la portada se ve sin
        entrar. No expone nada sensible — es el texto y las cifras que el
        equipo cura a mano para el hero.

        Sin fila configurada devuelve los valores por defecto: la portada nunca
        debe quedar en blanco por un dato de configuración que falta.

        La galería viene dos veces: `galleryImages` como lista de URLs ya
        firmadas —lo que consume la portada, que no sabe qué es un id— y
        `gallery` como `{id, url}`, para poder administrarla desde el panel.
      responses:
        '200': { description: Contenido del sitio }
    patch:
      tags: [content]
      summary: Editar el contenido (solo admin/superadmin)
      responses:
        '200': { description: Actualizado }
        '403': { $ref: '#/components/responses/Forbidden' }

  /site-content/gallery:
    post:
      tags: [content]
      summary: Agregar una imagen a la galería de la portada
      description: |
        La key va restringida a `site-gallery/`, que es donde la deja
        `POST /files/upload-url`. Sin esa restricción, quien administra el
        sitio podría publicar en la portada —que se ve SIN sesión— la key de un
        adjunto de entrega o de una evidencia privada, y el servidor la firmaría
        para cualquiera que entrara.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [s3Key]
              properties:
                s3Key: { type: string, pattern: '^site-gallery/' }
      responses:
        '201': { description: Agregada }
        '400': { description: La key no viene de `site-gallery/` }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Esa imagen ya está en la galería }

  /site-content/gallery/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    delete:
      tags: [content]
      summary: Quitar una imagen de la galería
      responses:
        '204': { description: Quitada }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users:
    get:
      tags: [users]
      summary: Personas visibles para quien pregunta
      description: |
        Este router no existía, y su ausencia mantenía sin migrar a cinco
        portales: todos necesitan saber "quiénes son mis estudiantes" o "quién
        es el mentor de este laboratorio". La versión con Hive lo resolvía
        teniendo la tabla entera de usuarios en el navegador, con la contraseña
        en texto plano.

        **Cada rol ve solo a quien le corresponde**, con la misma regla que ya
        usa el resto de la API para ese rol:

        | Rol | Ve a |
        |---|---|
        | admin / superadmin | todas |
        | asesor | las de su universidad |
        | LXD | quienes tienen acceso a sus cursos |
        | mentor | los estudiantes de sus laboratorios y los mentores que comparte |
        | empresa | su gente y los estudiantes de los laboratorios que patrocina |
        | donante | los estudiantes que apoya |
        | estudiante / alumni | **nadie** — su equipo llega dentro del proyecto |

        Un rol sin alcance recibe una página vacía, no un 403: el listado
        existe para todos, su alcance simplemente está vacío. Y un filtro
        NUNCA amplía el alcance.

        Correo, teléfono y cédula solo salen para quien administra la
        plataforma o acompaña a esa persona (admin, asesor, LXD, mentor); el
        resto recibe la ficha recortada.
      parameters:
        - { name: role, in: query, schema: { type: string }, description: 'Uno o varios separados por coma' }
        - { name: laboratoryId, in: query, schema: { type: string, format: uuid } }
        - { name: groupId, in: query, schema: { type: string, format: uuid } }
        - { name: companyId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string }, description: 'Busca por nombre' }
        - name: include
          in: query
          schema: { type: string }
          description: |
            `team`, `progress` y/o `reviews`, separados por coma. Agregan el
            equipo con su proyecto y etapa, el patrocinador, el avance general
            (promedio de sus cursos) y cuántas entregas revisó cada mentor — en
            una consulta por `include` para TODA la página.

            Es lo que necesitan las tablas de seguimiento de LXD, Mentor y
            Asesor, y las de mentores del portal Empresa: sin esto, cada fila
            haría cuatro peticiones.
      responses:
        '200': { description: Página de personas }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [users]
      summary: Crear una cuenta (admin/superadmin, y empresa para su equipo)
      description: |
        **Una empresa puede dar de alta a SU equipo formador**, y nada más:
        solo los roles `lxd` y `mentor`, y la cuenta queda atada a la empresa
        que la creó (`companyId`), lo diga o no el formulario. Sin ese amarre,
        una empresa podría crear una cuenta suelta —o peor, otra cuenta de
        empresa— y usarla para ver lo que su alcance no le permite. Cualquier
        otro rol responde 403.

        Un estudiante SIN tipo (`enactus` u `open_learning`) se rechaza con
        409: es lo que separa los dos mundos en toda la API, y una cuenta sin
        él quedaría donde ninguna regla de aislamiento aplica. Al revés
        también: un rol que no es estudiante no lleva tipo.

        Un admin **no** puede crear un superadmin — si pudiera, se ascendería
        creando una cuenta y entrando con ella.

        No acepta `canGradeOpenLearning` ni `canGradeEnactus`: esos se cambian
        por `PATCH /admin/users/{id}/can-grade`, que deja rastro en
        `audit_log`.
      responses:
        '201': { description: Cuenta creada }
        '403': { description: Sin permiso, o un admin intentando crear un superadmin }
        '409': { description: Correo repetido, o tipo de estudiante incoherente con el rol }

  /users/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [users]
      summary: Una persona
      description: |
        Cualquiera puede pedirse a sí mismo. Una persona fuera del alcance de
        quien pregunta responde `404`, no `403`: un `403` ya confirmaría que
        esa cuenta existe.
      responses:
        '200': { description: OK }
        '404': { description: No existe, o está fuera del alcance }
    patch:
      tags: [users]
      summary: Editar una cuenta (solo admin/superadmin)
      responses:
        '200': { description: Actualizada }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Tipo de estudiante incoherente con el rol }
    delete:
      tags: [users]
      summary: Eliminar una cuenta (borrado lógico, solo admin/superadmin)
      description: |
        Nadie puede eliminar su propia cuenta: es casi siempre un accidente, y
        podría dejar la plataforma sin quien la administre. Queda en
        `audit_log`.
      responses:
        '204': { description: Eliminada }
        '409': { description: Es la propia cuenta de quien lo pide }

  /courses:
    get:
      tags: [courses]
      summary: Listar cursos visibles para el rol
      description: |
        El alcance depende del rol: el estudiante ve lo publicado y visible de
        sus laboratorios; el LXD además sus propios borradores; el mentor lo
        que revisa; la empresa lo de sus LXD; el asesor lo de los laboratorios
        de sus estudiantes; el donante, nada.
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { in: query, name: laboratoryId, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [draft, published, archived] } }
        - { in: query, name: isOpenLearning, schema: { type: string, enum: ['true', 'false'] } }
        - { in: query, name: creatorId, schema: { type: string, format: uuid } }
        - { in: query, name: q, schema: { type: string }, description: Busca por nombre }
        - { in: query, name: include, schema: { type: string, example: 'modules,lessons' } }
      responses:
        '200':
          description: Página de cursos
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Course' }
    post:
      tags: [courses]
      summary: Crear un curso (nace en borrador)
      description: Solo lxd, admin y superadmin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /courses/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [courses]
      summary: Detalle de un curso
      parameters:
        - { in: query, name: include, schema: { type: string, example: 'modules,lessons' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '404':
          description: |
            No existe **o está fuera del alcance del rol**. Deliberadamente no
            se distinguen los dos casos.
    patch:
      tags: [courses]
      summary: Editar un curso
      description: Solo su creador o un administrador.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseInput' }
      responses:
        '200': { description: Actualizado }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [courses]
      summary: Borrado lógico
      description: |
        Responde **409** si el curso tiene progreso de estudiantes o está
        vinculado a módulos de la Ruta, con el detalle de qué lo bloquea y
        sugiriendo archivar. Borrar un curso en uso dejaría el objetivo —y con
        él el módulo, la fase y la Ruta entera— bloqueado en silencio.
      responses:
        '204': { description: Borrado }
        '409': { $ref: '#/components/responses/Conflict' }

  /courses/{id}/students:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [courses]
      summary: Estudiantes del curso, con todo lo que la tabla de seguimiento muestra
      description: |
        Avance, nota promedio, última actividad y comentario del equipo
        docente, **en una sola consulta**. Resolverlo en el cliente serían
        cuatro peticiones por fila: con treinta estudiantes, 120 viajes para
        dibujar una tabla.

        `avgGrade` es `null` cuando esa persona no tiene ninguna entrega
        calificada — no 0: "todavía no tiene nota" y "sacó cero" son cosas
        distintas.

        `lastActivityAt` es lo más reciente entre marcar una lección y hacer
        una entrega: "cuándo se supo de esta persona por última vez".

        **Alcance**: más amplio que editar el curso (el Mentor y el Asesor
        acompañan sin poder cambiarlo) pero no público — un estudiante no ve
        cómo va el resto de la clase. Fuera de alcance responde `404`, no
        `403`.
      responses:
        '200': { description: Estudiantes del curso }
        '404': { description: No existe, o está fuera del alcance }

  /courses/{id}/stats:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [courses]
      summary: Cifras del seguimiento
      description: |
        Inscritos, completados, avance promedio, nota promedio y entregas
        pendientes. Mismo alcance que la lista de estudiantes.
      responses:
        '200':
          description: Cifras
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrolled: { type: integer }
                  completed: { type: integer }
                  avgProgress: { type: number, minimum: 0, maximum: 1 }
                  avgGrade: { type: number, nullable: true }
                  pending: { type: integer }
        '404': { description: No existe, o está fuera del alcance }

  /courses/{id}/students/{studentId}/note:
    parameters:
      - { $ref: '#/components/parameters/id' }
      - { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [courses]
      summary: Comentario privado del equipo docente sobre un estudiante
      description: |
        **El estudiante no lo ve**: no hay ningún endpoint que se lo devuelva.
        La tabla `staff_notes` solo se lee desde el seguimiento del curso, y
        ahí solo entra quien puede acompañarlo.

        Es `PUT` y no `POST` porque hay UNA nota por estudiante y curso:
        escribir dos veces reemplaza, no acumula.

        El Asesor acompaña pero no escribe en el cuaderno del curso. Y no se
        puede dejar una nota sobre alguien que no cursa la materia: quedaría
        colgando de un par (estudiante, curso) que no existe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, maxLength: 4000 }
      responses:
        '200': { description: Comentario guardado }
        '403': { description: El asesor no escribe comentarios de curso }
        '404': { description: El curso está fuera del alcance, o esa persona no lo cursa }

  /courses/{id}/publish:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [courses]
      summary: Publicar
      description: |
        Valida que el curso tenga lecciones y que ninguna lección de video esté
        sin enlace ni archivo. Es donde vive esa regla desde la migración 0002.
      responses:
        '200': { description: Publicado }
        '409': { $ref: '#/components/responses/Conflict' }

  /courses/{id}/archive:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [courses]
      summary: Archivar
      description: |
        Deja de asignarse a estudiantes nuevos y desaparece de los catálogos,
        pero sigue existiendo para quienes ya tienen progreso.
      responses:
        '200': { description: Archivado }

  /catalogs:
    get:
      tags: [courses]
      summary: Competencias Enactus y ODS
      description: |
        Los dos catálogos fijos, tal como están en la base. El constructor de
        cursos dibuja una ficha por cada uno.

        Existen como endpoint en vez de como constante del cliente porque ya
        son claves ajenas de verdad (`course_competencies`, `course_ods`):
        copiarlas otra vez a Dart dejaría dos fuentes que se separan en
        silencio — una competencia agregada en la base no aparecería en el
        editor, y una escrita a mano en el cliente sería rechazada por la clave
        ajena recién al guardar.

        Son 12 y 17 filas que no cambian entre despliegues: se piden una vez
        por sesión.
      responses:
        '200':
          description: Los dos catálogos
          content:
            application/json:
              schema:
                type: object
                properties:
                  competencies:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: leadership }
                        name: { type: string, example: Liderazgo }
                  ods:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: ods_6 }
                        number: { type: integer, example: 6 }
                        title: { type: string, example: Agua limpia y saneamiento }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /courses/{id}/meta:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put:
      tags: [courses]
      summary: Reemplazar la categorización completa del curso
      description: |
        Etiquetas, objetivos, competencias, ODS, resultados de aprendizaje y
        prerrequisitos. El constructor las edita en un solo formulario, así que
        la API las recibe juntas y en una transacción: guardar etiquetas sí y
        ODS no dejaría el curso a medio describir sin que nadie se enterara.

        Los códigos de competencia y ODS se comprueban contra su catálogo antes
        de escribir. Las claves foráneas ya lo impedirían, pero un código
        inexistente saldría como un 500 sin explicación en vez de decir cuál
        está mal.

        Un objetivo con `category` se copia a la fase al vincular el curso a un
        módulo de Ruta; sin categoría es un objetivo general del curso.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseMeta' }
      responses:
        '200':
          description: Categorización guardada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Códigos fuera del catálogo, un prerrequisito que apunta a un curso
            borrado, o el curso puesto como prerrequisito de sí mismo.

  /courses/{id}/modules:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [courses]
      summary: Agregar un módulo (al final)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties: { title: { type: string } }
      responses:
        '201': { description: Creado }

  /courses/{id}/modules/order:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put:
      tags: [courses]
      summary: Reordenar TODOS los módulos
      description: |
        Un solo endpoint, no un PATCH por módulo: con
        `unique(course_id, order_index)` un intercambio de a uno falla en el
        primer paso. Va en transacción y en dos pasadas.

        La lista debe incluir exactamente los módulos del curso, una vez cada
        uno; si no, responde 409 y no cambia nada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Reorder' }
      responses:
        '200': { description: Nuevo orden }
        '409': { $ref: '#/components/responses/Conflict' }

  /modules/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      tags: [courses]
      summary: Renombrar un módulo
      responses: { '200': { description: Actualizado } }
    delete:
      tags: [courses]
      summary: Borrar un módulo (renumera el resto)
      responses: { '204': { description: Borrado } }

  /modules/{id}/lessons:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [courses]
      summary: Agregar una lección (al final)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LessonInput' }
      responses:
        '201': { description: Creada }
        '409':
          description: Una lección de tipo `link` sin `externalUrl`

  /modules/{id}/lessons/order:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put:
      tags: [courses]
      summary: Reordenar las lecciones de un módulo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Reorder' }
      responses: { '200': { description: Nuevo orden } }

  /lessons/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      tags: [courses]
      summary: Editar una lección
      responses: { '200': { description: Actualizada } }
    delete:
      tags: [courses]
      summary: Borrar una lección
      responses: { '204': { description: Borrada } }

  /lessons/{id}/video-upload-url:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [courses]
      summary: Paso 1 — URL firmada para subir el video
      description: |
        El archivo **nunca** pasa por la API: va directo del navegador a S3.
        API Gateway corta el payload en 10 MB y un video lo revienta.

        Se valida ANTES de firmar: `video/mp4` o `video/webm`, máximo 500 MB,
        y rol con permiso de contenido. Una URL firmada es un permiso real de
        escritura sobre el bucket.

        Recomendación para el LXD: MP4, H.264, 720p — reproduce nativamente en
        todos los navegadores. **No hay transcodificación**: lo que se sube es
        lo que se sirve.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, sizeBytes]
              properties:
                contentType: { type: string, enum: ['video/mp4', 'video/webm'] }
                sizeBytes: { type: integer, maximum: 524288000 }
      responses:
        '200':
          description: URL firmada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadUrl' }
        '400': { description: Content-type no permitido }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: Supera los 500 MB }
        '503': { description: Almacenamiento no configurado en este entorno }

  /lessons/{id}/video:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [courses]
      summary: Paso 3 — confirmar la subida
      description: |
        La `key` debe empezar por `lessons/<id>/`: si no, alguien podría
        apuntar su lección a un archivo subido para otra.

        Los videos propios se sirven **siempre por CloudFront con URL
        firmada**, nunca por URL directa de S3 (1 TB/mes gratis vs. 100 GB).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, sizeBytes, mimeType]
              properties:
                key: { type: string }
                sizeBytes: { type: integer }
                mimeType: { type: string }
                durationSec: { type: integer }
      responses:
        '200': { description: Lección actualizada }
        '409': { description: La key no corresponde a esta lección }

  /lessons/{id}/video-external:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [courses]
      summary: Asociar un video externo (YouTube/Vimeo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                durationSec: { type: integer }
      responses: { '200': { description: Lección actualizada } }

  /lessons/{id}/quiz-attempt:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [lessons]
      summary: Resolver un quiz (lo califica el servidor)
      description: |
        **La corrección ocurre acá, nunca en el cliente.** `answer_index` y
        `answer_text` no salen de la base en ninguna respuesta de la API: antes
        el curso viajaba al navegador con la clave dentro, así que cualquiera
        podía leerla desde las herramientas de desarrollo, y la nota que el
        cliente reportaba se guardaba sin verificar.

        Se devuelve **qué** preguntas estuvieron bien —eso es retroalimentación
        legítima— pero no cuál era la respuesta de las falladas: si la
        devolviera, bastaría con enviar un intento en blanco para obtener la
        clave completa.

        `multiple` y `truefalse` se corrigen por índice; `short` y `fill` por
        texto, normalizando espacios, mayúsculas y tildes; `order` comparando
        los elementos unidos por `|` contra el orden en que están guardadas las
        opciones, que es su clave. Aprueba con 60.

        Solo lecciones de tipo `quiz`: una encuesta no tiene respuesta correcta
        y calificarla dejaría un intento reprobado a quien solo dio su opinión.
        El portal la manda por `POST /submissions`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: object
                  description: '`{ [questionId]: índice | texto }`'
                  additionalProperties:
                    oneOf: [{ type: integer }, { type: string }]
      responses:
        '200':
          description: Resultado del intento
          content:
            application/json:
              schema:
                type: object
                properties:
                  attemptId: { type: string, format: uuid }
                  score: { type: integer, minimum: 0, maximum: 100 }
                  passed: { type: boolean }
                  correctCount: { type: integer }
                  totalQuestions: { type: integer }
                  correctness:
                    type: object
                    additionalProperties: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Solo un estudiante resuelve un quiz }
        '404': { description: La lección no está entre sus cursos }
        '409': { description: La lección no es un quiz, o no tiene preguntas configuradas }

  /lessons/{id}/quiz:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [courses]
      summary: Leer las preguntas CON su clave de respuestas (autoría)
      description: |
        La **única** lectura de la API que devuelve `answerIndex`/`answerText`,
        y existe por una razón concreta: sin ella, abrir en el constructor una
        lección ya hecha mostraría las respuestas en blanco y el primer guardado
        borraría la clave sin que nadie se enterara.

        Va detrás del mismo permiso de edición que el `PUT`, no de la
        visibilidad del curso: quien puede reescribir el quiz es exactamente
        quien puede leer su clave. Un estudiante recibe 403.
      responses:
        '200':
          description: Preguntas con su clave
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions:
                    type: array
                    items: { $ref: '#/components/schemas/AuthoringQuestion' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [courses]
      summary: Reemplazar TODAS las preguntas
      description: |
        Reemplazo, no parcheo pregunta por pregunta: el constructor edita la
        lista entera en un formulario y manda el resultado. Con endpoints por
        pregunta, quien borrara una fila y guardara la vería seguir ahí.

        Cada tipo usa una sola clave: `multiple` y `truefalse` guardan
        `answerIndex`; `short` y `fill`, `answerText`; en `order` la clave **es**
        el orden de las opciones. Las opciones vacías se rechazan en vez de
        filtrarse — filtrarlas correría los índices y cambiaría en silencio cuál
        es la respuesta correcta.

        En una lección de tipo `survey` no se acepta ninguna clave: una encuesta
        no tiene respuesta correcta.

        Los intentos ya resueltos no se tocan: guardan su nota calculada en el
        servidor, así que siguen siendo un registro válido de lo que pasó.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questions]
              properties:
                questions:
                  type: array
                  maxItems: 100
                  items: { $ref: '#/components/schemas/AuthoringQuestion' }
      responses:
        '200':
          description: Preguntas guardadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions:
                    type: array
                    items: { $ref: '#/components/schemas/AuthoringQuestion' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            La lección no es de tipo `quiz` ni `survey`, o hay preguntas
            incompletas. En ese caso `details.problems` lista **todas** las
            fallas (`{ question, problem }`), no solo la primera: quien arma un
            quiz de diez preguntas prefiere verlas juntas.

  /lessons/{id}/activity:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put:
      tags: [courses]
      summary: Configurar la actividad de la lección
      description: |
        Consigna, fecha límite, qué se entrega y con qué rúbrica se califica.
        Igual que el quiz, reemplaza el conjunto entero.

        `allowedTypes` vacío significa "cualquier tipo": es lo que ya asumía el
        portal del estudiante, y obligar a elegir uno rompería las actividades
        que hoy no tienen ninguno marcado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityInput' }
      responses:
        '200':
          description: Actividad guardada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityInput' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            La lección no es de tipo `activity`, o la actividad no pide ni texto
            ni archivo (no habría nada que entregar).

  /lessons/{id}/resource:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [courses]
      summary: Confirmar el recurso descargable subido (PDF, plantilla)
      description: |
        Tercer paso del mismo flujo que el video: el navegador ya subió el
        archivo con la URL firmada de `POST /files/upload-url` (propósito
        `lesson_resource`) y acá confirma la key.

        La key tiene que venir de `lesson-resources/`. Es la misma garantía que
        da el avatar —prefijo, no id de lección— porque el nombre lo genera el
        servidor al firmar, sin la lección adentro.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, fileName, contentType, sizeBytes]
              properties:
                key: { type: string, pattern: '^lesson-resources/' }
                fileName: { type: string }
                contentType: { type: string }
                sizeBytes: { type: integer, maximum: 26214400 }
      responses:
        '200': { description: Lección actualizada }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: La key no salió del endpoint de subida de recursos }
        '413': { description: Supera los 25 MB }

  /progress/lessons/{lessonId}/toggle:
    parameters:
      - { in: path, name: lessonId, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [progress]
      summary: Alternar una lección
      description: |
        Solo el propio estudiante. **No existe** una versión "marcar completa a
        otro": sería una forma de fabricar progreso. La única vía indirecta
        legítima es calificar una actividad, que completa su lección.

        La respuesta trae el progreso recalculado de curso, módulo, fase y
        Ruta: **el cliente no necesita ninguna llamada adicional**.
      responses:
        '200':
          description: Progreso recalculado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToggleImpact' }
        '403':
          description: No es estudiante, o no tiene acceso a ese curso/laboratorio
        '404': { $ref: '#/components/responses/NotFound' }

  /students/{id}/ruta-progress:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [students]
      summary: Ruta de Impacto completa
      description: |
        Laboratorios, fases, módulos, objetivos y cursos, con el desbloqueo y
        el estado de cada deadline.

        Un estudiante de Open Learning recibe **403**. Si quien pregunta es
        del equipo pero el estudiante objetivo es de Open Learning, responde
        **409** diciéndolo — nunca una lista vacía.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RutaProgress' }
        '403': { description: Cuenta de Open Learning, o no es su propio progreso }
        '409': { description: El estudiante objetivo es de Open Learning }

  /students/{id}/course-progress/{courseId}:
    parameters:
      - { $ref: '#/components/parameters/id' }
      - { in: path, name: courseId, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [students]
      summary: Progreso en un curso, con las lecciones completadas
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: El estudiante no tiene acceso a ese curso }

  /students/{id}/certificate-eligibility/{laboratoryId}:
    parameters:
      - { $ref: '#/components/parameters/id' }
      - { in: path, name: laboratoryId, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [students]
      summary: Si ya puede emitirse el certificado, y si no, qué falta
      responses: { '200': { description: OK } }

  /certificates:
    get:
      tags: [certificates]
      summary: Certificados
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { in: query, name: studentId, schema: { type: string, format: uuid } }
      responses: { '200': { description: Página de certificados } }

  /certificates/ruta:
    post:
      tags: [certificates]
      summary: Emitir el certificado de Ruta de Impacto
      description: |
        Doble candado a propósito:

        1. El endpoint valida que las 3 fases estén completas y, si no,
           responde **409 con el detalle de qué falta**.
        2. La base lo hace cumplir igual con el trigger
           `certificates_require_complete_ruta`.

        Requiere `can_grade_enactus` — la Ruta es contexto Enactus, no alcanza
        con el permiso de Open Learning. Admin y superadmin lo hacen sin pasar
        por el permiso, y queda en `audit_log`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, laboratoryId]
              properties:
                studentId: { type: string, format: uuid }
                laboratoryId: { type: string, format: uuid }
      responses:
        '201': { description: Emitido }
        '403': { description: Sin permiso de calificar en Enactus }
        '409':
          description: Ruta incompleta, o el certificado ya existía
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /laboratories:
    get:
      tags: [laboratories]
      summary: Laboratorios visibles para el rol
      description: Todo este recurso es **solo Enactus**.
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
      responses:
        '200': { description: Página de laboratorios }
        '403': { description: Cuenta de Open Learning }
    post:
      tags: [laboratories]
      summary: Crear un laboratorio, con sus TRES fases
      description: |
        Solo Admin. Las tres fases se crean junto con el laboratorio: no es una
        comodidad, es que un laboratorio sin fases no tiene Ruta y la vista
        `phase_unlocked` —la que decide qué ve cada estudiante— no tendría de
        dónde partir. Crearlas por separado dejaría una ventana en la que el
        laboratorio existe y no sirve.

        Las fases después se editan (`PATCH /phases/{id}`), pero no se agregan
        ni se borran: siempre son tres.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabInput' }
      responses:
        '201': { description: Creado, con sus tres fases }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: El patrocinador no es una cuenta de empresa }

  /laboratories/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [laboratories]
      summary: Laboratorio con la estructura de su Ruta
      description: |
        Describe el laboratorio (fases, objetivos, módulos). El **avance** de
        un estudiante puntual vive en `/students/{id}/ruta-progress`.
      responses:
        '200': { description: OK }
        '403': { description: Cuenta de Open Learning }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [laboratories]
      summary: Editar el laboratorio (solo Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabInput' }
      responses:
        '200': { description: Actualizado }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: El patrocinador no es una cuenta de empresa }
    delete:
      tags: [laboratories]
      summary: Borrado lógico, y solo si no hay nadie adentro
      description: |
        Mismo criterio que el borrado de cursos: con estudiantes asignados o
        certificados emitidos responde 409 con el detalle. Borrarlo dejaría el
        avance de esas personas apuntando a una Ruta que ya no existe, y sus
        certificados sin el laboratorio que los respalda.
      responses:
        '204': { description: Borrado }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Tiene estudiantes o certificados }

  /laboratories/{id}/mentors:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put:
      tags: [laboratories]
      summary: Reemplazar el conjunto de mentores
      description: |
        Reemplazo y no alta/baja de a uno: la pantalla edita la lista completa,
        y dos llamadas (quitar a uno, agregar a otro) pueden quedar a la mitad.
        Cada id tiene que ser una cuenta viva con rol `mentor`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdList' }
      responses:
        '200': { description: Nuevo conjunto }
        '409': { description: Hay cuentas que no son mentores }

  /laboratories/{id}/students:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put:
      tags: [laboratories]
      summary: Reemplazar los estudiantes asignados
      description: |
        Ojo con lo que esto significa: `student_laboratories` es también lo que
        da acceso a los CURSOS del laboratorio (regla `studentHasCourse` para
        Enactus). Quitar a alguien de acá le quita ese material — su avance no
        se borra, pero deja de verlo.

        Solo estudiantes (o egresados) **Enactus**: un Open Learning acá
        recibiría acceso sin haber pasado por Enactus, que es justo el
        aislamiento que la API sostiene en todas las demás lecturas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdList' }
      responses:
        '200': { description: Nuevo conjunto }
        '409': { description: Hay cuentas que no son estudiantes Enactus }

  /phases/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      tags: [laboratories]
      summary: Editar título, descripción y fecha límite de una fase
      responses:
        '200': { description: Actualizada }
        '404': { $ref: '#/components/responses/NotFound' }

  /phases/{id}/modules:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [laboratories]
      summary: Agregar un módulo a la fase (al final)
      description: |
        Después de crearlo se recalcula qué módulo es el de **mentoría**: es
        siempre el último de la fase, y el flag se recalcula en vez de confiar
        en que alguien lo mueva a mano. También sube `content_version`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties: { title: { type: string, minLength: 1 } }
      responses:
        '201': { description: Creado }

  /phases/{id}/modules/order:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put:
      tags: [laboratories]
      summary: Reordenar TODOS los módulos de la fase
      description: |
        Un solo endpoint y en dos pasadas: con `unique(phase_id, order_index)`
        un intercambio de a uno falla en el primer paso. Recalcula el módulo de
        mentoría al terminar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Reorder' }
      responses:
        '200': { description: Nuevo orden }
        '409': { description: La lista no coincide con los módulos de la fase }

  /phases/{id}/objectives:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [laboratories]
      summary: Agregar un objetivo a la fase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                category: { type: string, enum: [entrepreneurship, business] }
                text: { type: string, minLength: 1 }
      responses:
        '201': { description: Creado }

  /ruta-modules/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      tags: [laboratories]
      summary: Renombrar un módulo de la Ruta
      responses: { '200': { description: Actualizado } }
    delete:
      tags: [laboratories]
      summary: Borrar un módulo (renumera el resto)
      description: |
        Sus lecciones propias y sus vínculos a cursos caen por CASCADE. Los
        cursos en sí no se tocan: viven fuera de la Ruta.
      responses: { '204': { description: Borrado } }

  /ruta-modules/{id}/courses:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put:
      tags: [laboratories]
      summary: Vincular cursos completos al módulo
      description: |
        Un curso vive en UN solo módulo por laboratorio. Si ya está en otro
        módulo de la misma Ruta responde 409 con cuál: si no, su avance se
        contaría dos veces.

        **Importa los objetivos** de los cursos que se agregan: los objetivos
        categorizados del curso (`entrepreneurship`/`business`) pasan a ser
        objetivos de la fase. No es magia escondida — el constructor de cursos
        lo anuncia en su propia pantalla— y pasa junto con el vínculo en vez de
        en dos llamadas del cliente que podían quedar a la mitad.

        Si la fase ya tiene un objetivo con la MISMA categoría y texto, no se
        duplica: se le suma el curso. Es lo que permite exigir "todos los
        cursos" dentro de un solo objetivo, que es como se define completarlo.
        Los objetivos SIN categoría no se importan: describen el curso, no la
        fase. `importedObjectives` dice cuántos se crearon.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdList' }
      responses:
        '200': { description: Nuevo conjunto }
        '409': { description: Hay cursos ya vinculados a otro módulo de la Ruta }

  /ruta-modules/{id}/lessons:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [laboratories]
      summary: Lección propia del módulo (lectura o entrega, no de un curso)
      description: |
        Se edita y se borra con `PATCH`/`DELETE /lessons/{id}`, igual que una
        lección de curso — esas rutas ya distinguen los dos padres.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LessonInput' }
      responses:
        '201': { description: Creada }
        '409': { description: Una lección de tipo `link` sin `externalUrl` }

  /objectives/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      tags: [laboratories]
      summary: Editar un objetivo de fase
      responses: { '200': { description: Actualizado } }
    delete:
      tags: [laboratories]
      summary: Borrar un objetivo de fase
      responses: { '204': { description: Borrado } }

  /objectives/{id}/courses:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put:
      tags: [laboratories]
      summary: Los cursos que dan el objetivo por cumplido
      description: |
        El objetivo se completa cuando el estudiante terminó el 100% de TODOS
        ellos. Un objetivo **sin cursos nunca se completa** —no se puede marcar
        a mano— y eso traba la fase entera para todo el laboratorio, así que la
        respuesta lo avisa con `neverCompletable: true` en vez de dejarlo pasar
        callado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdList' }
      responses:
        '200':
          description: Nuevo conjunto
          content:
            application/json:
              schema:
                type: object
                properties:
                  courseIds:
                    type: array
                    items: { type: string, format: uuid }
                  neverCompletable: { type: boolean }
        '409': { description: Hay cursos que ya no existen }

  /projects:
    get:
      tags: [orgs]
      summary: Listar proyectos
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { in: query, name: include, schema: { type: string, example: ods } }
      responses: { '200': { description: Página de proyectos } }
    post:
      tags: [orgs]
      summary: Crear un proyecto (solo admin/superadmin)
      responses:
        '201': { description: Creado }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [orgs]
      summary: Detalle con el equipo y el rol de cada integrante
      responses: { '200': { description: OK } }
    patch:
      tags: [orgs]
      summary: Editar (admin, superadmin o asesor)
      description: El asesor **edita pero no crea**.
      responses: { '200': { description: Actualizado } }
    delete:
      tags: [orgs]
      summary: Borrado lógico (solo admin/superadmin)
      responses: { '204': { description: Borrado } }

  /groups:
    get: { tags: [orgs], summary: Listar equipos, responses: { '200': { description: OK } } }
    post: { tags: [orgs], summary: Crear equipo, responses: { '201': { description: Creado } } }

  /groups/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { tags: [orgs], summary: Detalle con integrantes, responses: { '200': { description: OK } } }
    patch: { tags: [orgs], summary: Editar, responses: { '200': { description: Actualizado } } }
    delete: { tags: [orgs], summary: Borrado lógico, responses: { '204': { description: Borrado } } }

  /groups/{id}/members:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put:
      tags: [orgs]
      summary: Reemplazar los integrantes, cada uno con su rol en el proyecto
      description: |
        Un solo endpoint en vez de altas y bajas sueltas: así el equipo nunca
        queda a medias entre dos llamadas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                members:
                  type: array
                  items:
                    type: object
                    required: [userId]
                    properties:
                      userId: { type: string, format: uuid }
                      roleInProject:
                        type: string
                        enum: [leader, research, finance, communications, design, operations, member]
      responses: { '200': { description: Integrantes actualizados } }

  /submissions:
    get:
      tags: [submissions]
      summary: Entregas visibles para el rol
      description: Un estudiante ve **solo las suyas**; no hay parámetro que lo cambie.
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { in: query, name: courseId, schema: { type: string, format: uuid } }
        - { in: query, name: studentId, schema: { type: string, format: uuid } }
        - { in: query, name: pending, schema: { type: string, enum: ['true', 'false'] } }
      responses: { '200': { description: Página de entregas } }
    post:
      tags: [submissions]
      summary: Crear una entrega (solo el propio estudiante)
      responses:
        '201': { description: Creada }
        '403': { description: Sin acceso a ese curso o laboratorio }

  /submissions/{id}/grade:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [submissions]
      summary: Calificar
      description: |
        Requiere `can_grade` **en el contexto del curso**: Open Learning y
        Enactus son permisos separados, y el contexto sale del curso, no del
        cuerpo de la petición.

        La escala se guarda junto a la nota: hoy conviven cuatro escalas en el
        mismo campo y el número por sí solo no significa nada.

        Calificar una actividad **completa su lección** (marca, nunca alterna).
        Queda en `audit_log`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gradingMode]
              properties:
                grade: { type: number, nullable: true }
                gradingMode: { type: string, enum: [points100, passfail, review, scale5] }
                feedback: { type: string }
      responses:
        '200': { description: Calificada }
        '400': { description: Nota fuera del rango de la escala }
        '403': { description: Sin permiso de calificar en ese contexto }

  /submissions/{id}/review:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [submissions]
      summary: Comentar sin calificar (Mentor)
      description: |
        El Mentor revisa y comenta, pero **no pone nota**. Este endpoint no
        toca `grade` bajo ninguna circunstancia.
      responses: { '200': { description: Revisada } }

  /submissions/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    delete:
      tags: [submissions]
      summary: Borrado lógico
      description: El estudiante solo puede borrar la suya mientras no esté calificada ni comentada.
      responses:
        '204': { description: Borrada }
        '409': { description: Ya calificada o comentada }

  /evidences:
    get:
      tags: [content]
      summary: Evidencias de impacto
      description: Un donante ve **solo las suyas**, sin importar qué pida.
      responses: { '200': { description: Página de evidencias } }
    post:
      tags: [content]
      summary: Crear (solo admin/superadmin)
      responses: { '201': { description: Creada } }

  /evidences/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch: { tags: [content], summary: Editar, responses: { '200': { description: Actualizada } } }
    delete: { tags: [content], summary: Borrado lógico, responses: { '204': { description: Borrada } } }

  /calendar-events:
    get:
      tags: [content]
      summary: Eventos visibles para el rol
      description: |
        `ruta_impacto` es global para el mundo Enactus; `mentoria` sigue atado
        al laboratorio; `open_learning_sync`, al curso. Empresa y Donante no
        tienen calendario.
      responses: { '200': { description: Página de eventos } }
    post:
      tags: [content]
      summary: Crear un evento
      description: El LXD solo `open_learning_sync`; el Mentor solo `ruta_impacto`/`mentoria`; el Admin, cualquiera.
      responses:
        '201': { description: Creado }
        '403': { description: Ese rol no puede crear ese tipo de evento }

  /calendar-events/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch: { tags: [content], summary: Editar (solo quien lo creó, o admin), responses: { '200': { description: Actualizado } } }
    delete: { tags: [content], summary: Borrado lógico, responses: { '204': { description: Borrado } } }

  /communication-resources:
    get:
      tags: [content]
      summary: Plantillas de comunicaciones
      description: Las publica el Admin; las leen Asesor, Mentor y LXD.
      responses: { '200': { description: Página de recursos } }
    post: { tags: [content], summary: Publicar (solo admin/superadmin), responses: { '201': { description: Creado } } }

  /communication-resources/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    delete: { tags: [content], summary: Borrado lógico, responses: { '204': { description: Borrado } } }

  /notifications:
    get:
      tags: [content]
      summary: Notificaciones propias
      description: Siempre las del usuario de la sesión; no hay parámetro para pedir las de otro.
      responses: { '200': { description: Página con el conteo de no leídas } }
    post:
      tags: [content]
      summary: Mandar un aviso a una o varias personas
      description: |
        **A quién se le puede avisar es una pregunta de permisos, no de
        formulario.** La regla es una sola y reusa alcances que ya existen: se
        le puede avisar a quien uno ya podría ver —el alcance de `GET /users`—
        o, si quien manda es Donante o Empresa, a cualquier estudiante Enactus,
        que es exactamente lo que BuscaTalento ofrece hacer.

        Un destinatario fuera de alcance responde 403 con **cuántos**, nunca con
        quiénes: decir "estos tres ids no existen y estos dos sí" convertiría el
        endpoint en una forma de enumerar la plataforma.

        Nadie recibe el correo de nadie: el aviso llega a la bandeja de la
        persona dentro de la plataforma. Es la razón por la que BuscaTalento
        puede mostrar perfiles sin mostrar datos de contacto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds, title]
              properties:
                userIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
                title: { type: string, minLength: 1 }
                body: { type: string }
      responses:
        '201':
          description: Enviado
          content:
            application/json:
              schema:
                type: object
                properties: { sent: { type: integer } }
        '403': { description: Hay destinatarios fuera de tu alcance }

  /talent:
    get:
      tags: [content]
      summary: BuscaTalento — directorio de talento Enactus
      description: |
        El **único** listado de personas cuyo alcance es deliberadamente más
        ancho que el de `/users`. Ahí un donante ve solo a quienes apoya y una
        empresa a su gente; acá los dos ven a todos los estudiantes Enactus,
        porque de eso se trata la pantalla: descubrir a alguien que todavía no
        conocen.

        Por eso vive en su propia ruta y no como un filtro de `/users`. Un
        filtro que ensancha el alcance es justo la clase de cosa que después
        nadie recuerda que existe; una ruta aparte se lee y se audita sola.

        Expone el **perfil profesional, no los datos de contacto**: nombre,
        universidad, carrera, ciudad, avance y logros. Ni correo, ni teléfono,
        ni cédula. Para hablarles está `POST /notifications`.

        Los de Open Learning no aparecen: no tienen Ruta de Impacto, así que no
        tienen objetivos cumplidos que mostrar. Vienen ordenados por objetivos
        EMPRESARIALES cumplidos, que es la razón por la que una empresa entra.
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
      responses:
        '200': { description: Página de perfiles }
        '403': { description: BuscaTalento es para Donantes y Empresas }

  /notifications/read:
    post:
      tags: [content]
      summary: Marcar todas como leídas
      responses: { '204': { description: OK } }

  /forum-posts:
    get:
      tags: [forum]
      summary: Publicaciones del foro
      description: |
        Solo Admin, Super Admin, Asesores y estudiantes/alumni **Enactus**.
        Los de Open Learning, LXD, Mentor, Empresa y Donante reciben 403.
      responses:
        '200': { description: Página de publicaciones }
        '403': { $ref: '#/components/responses/Forbidden' }
    post: { tags: [forum], summary: Publicar, responses: { '201': { description: Creada } } }

  /forum-posts/stats:
    get:
      tags: [forum]
      summary: Cifras del encabezado del foro
      description: |
        Personas distintas que publicaron en los últimos 7 días, y los tres
        equipos con más publicaciones. Eran agregados del cliente que
        recorrían todas las publicaciones y todos los usuarios en memoria.
      responses:
        '200': { description: Cifras }
        '403': { $ref: '#/components/responses/Forbidden' }

  /forum-posts/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { tags: [forum], summary: Publicación con sus respuestas, responses: { '200': { description: OK } } }
    delete:
      tags: [forum]
      summary: Borrar
      description: El autor borra lo suyo; Admin y Super Admin, cualquiera.
      responses: { '204': { description: Borrada } }

  /forum-posts/{id}/replies:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { tags: [forum], summary: Responder, responses: { '201': { description: Creada } } }

  /forum-posts/{id}/like:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [forum]
      summary: Apoyar o retirar el apoyo
      description: Un apoyo por persona. Es un INSERT o un DELETE, sin condición de carrera.
      responses: { '200': { description: Estado del apoyo y el conteo } }

  /forum-posts/{id}/pin:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { tags: [forum], summary: Fijar (moderación de admin), responses: { '200': { description: OK } } }

  /files/upload-url:
    post:
      tags: [files]
      summary: URL firmada para archivos que no son video
      description: |
        Evidencias, recursos de comunicaciones, adjuntos de entregas y
        avatares. Máximo 25 MB; el rol permitido depende del propósito.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, fileName, contentType, sizeBytes]
              properties:
                purpose:
                  type: string
                  enum: [evidence, communication_resource, submission, avatar]
                fileName: { type: string }
                contentType: { type: string }
                sizeBytes: { type: integer, maximum: 26214400 }
      responses:
        '200':
          description: URL firmada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadUrl' }
        '400': { description: Tipo de archivo no permitido }
        '403': { description: Ese rol no puede subir ese tipo de archivo }
        '413': { description: Supera los 25 MB }
        '503': { description: Almacenamiento no configurado }

  /files/download-url:
    post:
      tags: [files]
      summary: URL firmada de lectura para un archivo ya subido
      description: |
        Sin este endpoint el cliente puede guardar keys pero no mostrar nada:
        ni la foto de perfil, ni el PDF de una lección, ni el adjunto que
        entregó un estudiante.

        **Quién puede leer qué se resuelve contra la fila que referencia la
        key**, no contra su prefijo, y con la misma regla de visibilidad que el
        listado correspondiente: un donante que solo ve sus evidencias en
        `GET /evidences` tampoco puede firmar la foto de otro.

        Una key que ninguna tabla referencia responde `404`, no `403` — un
        `403` confirmaría que el objeto está en el bucket.

        Los videos se rechazan con `400`: se sirven por CloudFront, nunca por
        S3 directo. Es una decisión de costo (1 TB/mes de CloudFront frente a
        transferencia de S3 cobrada desde el primer byte) aplicada en el único
        punto que firma lecturas.

        Es `POST` y no `GET` para que la key no quede en el log de acceso de
        API Gateway ni en el historial del navegador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, example: 'avatars/6f1c….png' }
      responses:
        '200':
          description: URL firmada de lectura, válida una hora
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expiresInSeconds: { type: integer, example: 3600 }
                  fileName: { type: string, nullable: true }
                  contentType: { type: string, nullable: true }
        '400': { description: Es una key de video, o falta la key }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Ninguna tabla referencia esa key }
        '503': { description: Almacenamiento no configurado }

  /admin/users/{id}/can-grade:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      tags: [admin]
      summary: Cambiar el permiso de calificar de un LXD
      description: |
        Son **dos** permisos, no uno. Cada cambio queda en `audit_log` con
        quién, a quién, cuándo, y los valores anterior y nuevo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                canGradeOpenLearning: { type: boolean }
                canGradeEnactus: { type: boolean }
      responses:
        '200': { description: Usuario actualizado }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: El permiso solo aplica a cuentas LXD }

  /admin/backup:
    get:
      tags: [admin]
      summary: Respaldo completo
      description: |
        **Sin contraseñas ni sesiones.** Hoy `exportBackupJson()` vuelca la
        caja `users` entera —contraseñas en texto plano incluidas— a un archivo
        que el Admin descarga.
      responses: { '200': { description: Respaldo en JSON } }

  /admin/restore:
    post:
      tags: [admin]
      summary: Restaurar un respaldo
      description: |
        El endpoint más peligroso de la API. **Solo superadmin**, transaccional
        (o entra todo, o no entra nada), y exige la confirmación literal
        `REEMPLAZAR TODOS LOS DATOS`. Queda en `audit_log`.

        Efecto secundario deliberado: al reemplazar `users` se caen las
        sesiones abiertas de todo el mundo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, data, confirm]
              properties:
                version: { type: integer }
                data: { type: object }
                confirm: { type: string, enum: ['REEMPLAZAR TODOS LOS DATOS'] }
      responses:
        '200': { description: Filas restauradas por tabla }
        '400': { description: Falta la confirmación exacta }
        '403': { description: Solo superadmin }

  /admin/storage/video:
    get:
      tags: [admin]
      summary: Almacenamiento total de video
      description: |
        La métrica que va a crecer y necesita visibilidad: sin
        transcodificación, lo que se sube es lo que se guarda y lo que se paga.
      responses: { '200': { description: Bytes y GB, por lecciones e intros } }

  /admin/metrics:
    get:
      tags: [admin]
      summary: Métricas y totales del panel Admin
      description: |
        Los totales de la plataforma (`counts`) más horas por competencia,
        cobertura de ODS y horas patrocinadas por empresa. Van juntos porque el
        panel los muestra juntos: pedirlos por separado costaría cuatro viajes
        para dibujar una pantalla.

        Los `counts` están acá y no se cuentan las listas en el cliente por una
        razón concreta: los listados vienen paginados de a 100, así que
        `courses.length` dejaría de crecer al llegar a cien y el panel
        mostraría un número que parece bien y está mal. Todo excluye lo borrado
        lógicamente. Las tres las calculaba el cliente recorriendo toda la base en
        memoria; contra una base remota eso sería descargar cada curso, cada
        estudiante y cada progreso para sumar tres números.

        Van juntas en una sola respuesta porque la pantalla las muestra juntas.
        Se calculan sobre `student_course_access` y `course_progress`, las
        mismas vistas que usa el resto de la API: antes podían discrepar del
        avance que veía el estudiante y nadie lo habría notado.

        Las horas de un curso son las **certificadas** si las tiene, si no las
        estimadas, y siempre **ponderadas por el avance real**: un curso de 10
        horas que alguien lleva al 40% aporta 4, no 10 ni 0.
      responses:
        '200':
          description: Las tres métricas
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    description: Totales de la plataforma, sin techo de paginación.
                    properties:
                      students: { type: integer }
                      alumni: { type: integer }
                      mentors: { type: integer }
                      lxds: { type: integer }
                      advisors: { type: integer }
                      companies: { type: integer }
                      donors: { type: integer }
                      projects: { type: integer }
                      groups: { type: integer }
                      courses: { type: integer }
                      laboratories: { type: integer }
                      certificates: { type: integer }
                      universities: { type: integer }
                      submissionsPending: { type: integer }
                  hoursByCompetency:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        name: { type: string }
                        hours: { type: number }
                  odsCompletionRate:
                    type: array
                    description: |
                      `total` cuenta pares (estudiante, curso) con acceso, no
                      estudiantes. Se devuelven los crudos además de la tasa
                      porque un 100% sobre dos personas y otro sobre doscientas
                      no son la misma noticia, y la barra sola no lo distingue.
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        number: { type: integer }
                        title: { type: string }
                        rate: { type: number, minimum: 0, maximum: 1 }
                        completed: { type: integer }
                        total: { type: integer }
                  sponsoredHoursByCompany:
                    type: array
                    description: |
                      Una empresa patrocina de dos formas y las dos cuentan: el
                      curso directamente o el laboratorio al que pertenece. El
                      patrocinio directo manda, para que un curso patrocinado
                      por dos no sume sus horas dos veces.
                    items:
                      type: object
                      properties:
                        companyId: { type: string, format: uuid }
                        companyName: { type: string }
                        hours: { type: number }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de 12 h. Se renueva con `/auth/refresh`.

  parameters:
    id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    pageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Unauthorized:
      description: Sin sesión, token inválido o expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: El rol no tiene permiso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No existe, o está fuera del alcance del rol
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: El estado actual no permite la operación
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Demasiados intentos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - validation_error
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - payload_too_large
                - too_many_requests
                - storage_not_configured
                - internal_error
            message: { type: string }
            details: {}

    Page:
      type: object
      properties:
        data: { type: array, items: {} }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    Session:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 43200, description: Segundos (12 h) }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      description: Nunca incluye el hash de la contraseña.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [superadmin, admin, advisor, donor, lxd, mentor, company, student, alumni]
        studentType:
          type: string
          nullable: true
          enum: [enactus, open_learning]
        university: { type: string }
        career: { type: string }
        canGradeOpenLearning: { type: boolean }
        canGradeEnactus: { type: boolean }
        avatarS3Key: { type: string, nullable: true }
        joinedAt: { type: string, format: date-time, nullable: true }

    CourseInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        subtitle: { type: string }
        description: { type: string }
        fullDescription: { type: string }
        laboratoryId: { type: string, format: uuid, nullable: true }
        isOpenLearning: { type: boolean }
        level: { type: string, enum: [basic, intermediate, advanced] }
        estimatedHours: { type: integer, minimum: 0 }
        generatesCertificate: { type: boolean }
        certifiedHours: { type: integer, minimum: 0 }
        maxStudents: { type: integer, minimum: 0, description: '0 = sin límite' }
        visible: { type: boolean }

    Course:
      allOf:
        - { $ref: '#/components/schemas/CourseInput' }
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [draft, published, archived] }
            creatorId: { type: string, format: uuid, nullable: true }
            createdAt: { type: string, format: date-time }
            deletedAt: { type: string, format: date-time, nullable: true }
            modules:
              type: array
              description: Solo con `include=modules`
              items: {}

    LessonInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        type:
          type: string
          enum: [video, pdf, resource, link, quiz, activity, survey]
        description: { type: string }
        durationMin: { type: integer, minimum: 0 }
        externalUrl:
          type: string
          format: uri
          nullable: true
          description: Obligatorio si `type = link`

    AuthoringQuestion:
      type: object
      required: [question]
      description: |
        Una pregunta **con** su clave de respuestas. Solo aparece en los
        endpoints de autoría (`GET`/`PUT /lessons/{id}/quiz`), nunca en la
        lectura del curso que ve un estudiante.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        kind:
          type: string
          enum: [multiple, truefalse, short, fill, order]
        question: { type: string, minLength: 1 }
        options:
          type: array
          items: { type: string }
          description: |
            `multiple`: las alternativas, sin ninguna vacía. `order`: los
            elementos **en el orden correcto** — ahí las opciones son la clave.
            En el resto de los tipos se ignoran.
        answerIndex:
          type: integer
          nullable: true
          minimum: 0
          description: '`multiple`: índice de la opción correcta. `truefalse`: 0 = Verdadero, 1 = Falso.'
        answerText:
          type: string
          nullable: true
          description: '`short` y `fill`: se compara normalizando espacios, mayúsculas y tildes.'

    ActivityInput:
      type: object
      properties:
        description: { type: string }
        deadline: { type: string, format: date, nullable: true }
        requiresFile: { type: boolean, default: false }
        requiresText: { type: boolean, default: true }
        maxFiles: { type: integer, minimum: 1, default: 1 }
        gradingMode:
          type: string
          enum: [points100, passfail, review, scale5]
        allowedTypes:
          type: array
          items: { type: string, enum: [pdf, video, document, image, zip] }
          description: Vacío = cualquier tipo.
        rubric:
          type: array
          maxItems: 50
          items:
            type: object
            required: [criterion]
            properties:
              criterion: { type: string, minLength: 1 }
              points: { type: integer, minimum: 0 }

    CourseMeta:
      type: object
      properties:
        tags:
          type: array
          items: { type: string }
        objectives:
          type: array
          items:
            type: object
            required: [text]
            properties:
              id: { type: string, format: uuid, readOnly: true }
              category:
                type: string
                nullable: true
                enum: [entrepreneurship, business]
              text: { type: string, minLength: 1 }
        competencies:
          type: array
          items: { type: string }
          description: Códigos del catálogo `competencies`.
        ods:
          type: array
          items: { type: string }
          description: Códigos del catálogo `ods_goals`.
        learningOutcomes:
          type: array
          items: { type: string }
        prerequisiteCourseIds:
          type: array
          items: { type: string, format: uuid }

    LabInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        objectives: { type: string }
        sponsorCompanyId:
          type: string
          format: uuid
          nullable: true
          description: Tiene que ser una cuenta con rol `company`.

    IdList:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string, format: uuid }
          description: El conjunto COMPLETO; reemplaza al anterior.

    Reorder:
      type: object
      required: [orderedIds]
      properties:
        orderedIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
          description: Exactamente los elementos del padre, una vez cada uno.

    UploadUrl:
      type: object
      properties:
        uploadUrl: { type: string, format: uri }
        key: { type: string }
        expiresInSeconds: { type: integer, example: 900 }
        method: { type: string, example: PUT }
        headers: { type: object }

    ToggleImpact:
      type: object
      properties:
        lessonId: { type: string, format: uuid }
        completed: { type: boolean }
        course:
          type: object
          nullable: true
          properties:
            courseId: { type: string, format: uuid }
            totalLessons: { type: integer }
            completedLessons: { type: integer }
            ratio: { type: number, format: float }
            isComplete: { type: boolean }
        rutaImpact:
          type: array
          description: Un elemento por laboratorio donde el curso esté en la Ruta.
          items:
            type: object
            properties:
              laboratoryId: { type: string, format: uuid }
              moduleId: { type: string, format: uuid }
              moduleComplete: { type: boolean }
              phaseId: { type: string, format: uuid }
              phaseOrder: { type: integer }
              phaseModulesDone: { type: integer }
              phaseModulesTotal: { type: integer }
              phaseComplete: { type: boolean }
              rutaPhasesDone: { type: integer }
              rutaPhasesTotal: { type: integer }
              rutaComplete: { type: boolean }
              certificateAvailable: { type: boolean }

    RutaProgress:
      type: object
      properties:
        studentId: { type: string, format: uuid }
        studentName: { type: string }
        laboratories:
          type: array
          items:
            type: object
            properties:
              laboratoryId: { type: string, format: uuid }
              laboratoryName: { type: string }
              phasesTotal: { type: integer }
              phasesDone: { type: integer }
              isComplete: { type: boolean }
              certificateIssued: { type: boolean }
              phases:
                type: array
                items:
                  type: object
                  properties:
                    phaseId: { type: string, format: uuid }
                    orderIndex: { type: integer }
                    title: { type: string }
                    deadline: { type: string, format: date, nullable: true }
                    deadlineStatus:
                      type: string
                      enum: [none, on_track, approaching, overdue]
                      description: Una fase completada nunca aparece atrasada.
                    modulesTotal: { type: integer }
                    modulesDone: { type: integer }
                    isComplete: { type: boolean }
                    isUnlocked: { type: boolean }
                    objectives: { type: array, items: {} }
                    modules: { type: array, items: {} }
