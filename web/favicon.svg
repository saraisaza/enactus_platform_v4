      <feGaussianBlur stdDeviation="6"></feGaussianBlur>
    </filter>
    <linearGradient id="exaShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC107" stop-opacity="0"></stop>
      <stop offset="0.5" stop-color="#FFC107" stop-opacity="0.95"></stop>
      <stop offset="1" stop-color="#FFC107" stop-opacity="0"></stop>
    </linearGradient>
    <g id="exaX"><rect x="56.5" y="22" width="15" height="84" rx="4" transform="rotate(24 64 64)" fill="#FFFFFF"></rect><rect x="56.5" y="22" width="15" height="84" rx="4" transform="rotate(-24 64 64)" fill="#FFFFFF"></rect></g>
