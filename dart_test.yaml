# Etiquetas de la suite.
#
# `e2e` marca las pruebas que salen a la red contra el backend real. Se saltan
# solas si está apagado, así que `flutter test` sigue funcionando sin él; la
# etiqueta existe para poder excluirlas a propósito:
#
#   flutter test -x e2e        # solo las que no tocan la red
#   flutter test -t e2e        # solo el recorrido de punta a punta
tags:
  e2e:
    timeout: 2x
  # `capturas` toma una imagen de cada pantalla para comparar el aspecto
  # antes y después de un cambio (ver `test/capturas/capturas_test.dart`).
  # Las imágenes dependen de cómo dibuja las letras cada sistema, así que no
  # corre sola: se pide con `--run-skipped`.
  capturas:
    skip: "Solo a mano: flutter test test/capturas --run-skipped"
