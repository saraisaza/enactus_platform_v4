<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Plataforma educativa de eduXaction Colombia">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="eduXaction Colombia">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" href="favicon-32.png" sizes="32x32">

  <title>eduXaction Colombia</title>
  <link rel="manifest" href="manifest.json">

  <!-- Identidad eduXaction: logotipo tipográfico (ver assets/media/eduxaction-logo.css).
       Rutas relativas a web/ (no /assets/): en Flutter Web los assets
       declarados en pubspec.yaml se sirven bajo assets/assets/media/..., que
       es para el propio Flutter — este archivo estático vive junto a
       index.html y se sirve desde la raíz del build. -->
  <link rel="stylesheet" href="eduxaction-logo.css">

  <!-- Splash de carga: logotipo eduXaction con pulso suave sobre fondo oscuro -->
  <style>
    #enactus-splash {
      position: fixed;
      inset: 0;
      /* --exa-bg del paquete de marca. Antes era #08080A, el negro anterior:
         al montar Flutter la pantalla saltaba de negro a gris. */
      background: #35343A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #enactus-splash .exa-logo {
      animation: enactus-pulse 1.6s ease-in-out infinite;
    }
    #enactus-splash .bar {
      width: 160px;
      height: 3px;
      border-radius: 3px;
      background: #22262b;
      overflow: hidden;
    }
    #enactus-splash .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      /* Tricolor de la bandera de Colombia, en sus proporciones reales */
      background: linear-gradient(90deg,
        #fcd116 0%, #fcd116 50%,
        #003893 50%, #003893 75%,
        #ce1126 75%, #ce1126 100%);
      animation: enactus-slide 1.2s ease-in-out infinite;
    }
    @keyframes enactus-pulse {
      0%, 100% { transform: scale(1);    opacity: 1; }
      50%      { transform: scale(1.06); opacity: 0.85; }
    }
    @keyframes enactus-slide {
      0%   { margin-left: -40%; }
      100% { margin-left: 100%; }
    }
  </style>
</head>
<body>
  <div id="enactus-splash">
    <span class="exa-logo" role="img" aria-label="eduXaction" style="--exa-size:110px; --exa-accent:#FFFFFF; --exa-shine:#FFC107; --exa-sweep:3.6s">edu<span class="exa-x">X</span>action</span>
    <div class="bar"></div>
  </div>

  <!-- En archivo aparte, NO inline: la CSP de producción bloquea los scripts
       inline y el bloqueo es silencioso — el splash se quedaría para siempre.
       Ver el comentario de splash.js. -->
  <script src="splash.js"></script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
