<!-- eduXaction - logotipo neon animado -->
<link rel="stylesheet" href="/assets/eduxaction-logo.css">

<!-- 1. Logotipo horizontal -->
<span class="exa-logo" role="img" aria-label="eduXaction">edu<span class="exa-x">X</span>action</span>

<!-- 2. Tamano a medida (cualquier unidad CSS) -->
<span class="exa-logo" style="--exa-size: 32px" role="img" aria-label="eduXaction">edu<span class="exa-x">X</span>action</span>

<!-- 3. Sobre fondo claro -->
<span class="exa-logo exa-logo--on-light" role="img" aria-label="eduXaction">edu<span class="exa-x">X</span>action</span>

<!-- 4. Icono cuadrado -->
<span class="exa-mark" role="img" aria-label="eduXaction"><span class="exa-x">X</span></span>

<!-- 5. Favicon e iconos -->
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<!-- 6. Version SVG (email, PDF, donde no llega el CSS) -->
<img src="/assets/eduxaction-mark-animado.svg" width="104" height="104" alt="eduXaction">
